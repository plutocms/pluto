name: Update @plutocms

# Moves the @plutocms/* dependencies to the newest versions on npm, checks the
# result with ci.yml, and merges it when CI is green. The same file is in every
# Pluto repo. A release starts it in every repo at once
# (`scripts/plutocms-fanout.sh` in the workspace); the schedule is a fallback.
# The commit is `chore(deps)`, so a package does not release for it.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plutocms-update
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      branch: ${{ steps.commit.outputs.branch }}
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update the @plutocms packages
        id: update
        run: node .github/scripts/plutocms-update.mjs

      - name: Commit
        id: commit
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to update."
            exit 0
          fi
          branch=deps/plutocms
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -u
          git commit -m "chore(deps): update @plutocms packages" -m "$SUMMARY"
          git push --force origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --head deps/plutocms --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --head deps/plutocms --base main \
              --title "chore(deps): update @plutocms packages" \
              --body "$SUMMARY. Opened by the Update @plutocms workflow, which merges it when CI is green."
            pr=$(gh pr list --head deps/plutocms --state open --json number -q '.[0].number')
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  # A pull request opened with github.token starts no workflow, so this job
  # runs the shared checks on the branch.
  ci:
    name: CI
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.update.outputs.branch }}

  merge:
    name: Merge
    needs: [update, ci]
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ needs.update.outputs.pr }}" --squash --delete-branch -R "${{ github.repository }}"
