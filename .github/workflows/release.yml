name: Release

on:
  push:
    branches: [main]

  # Escape hatch: the GitHub release and tag are created before `npm publish`
  # runs, so a failed publish cannot be retried by re-running release-please.
  # Use this to publish an existing tag without cutting a new version. Every
  # package of the repo whose version is not on npm yet is published.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish to npm (e.g. v0.1.2, or 3d-v0.1.0 in a repo with many packages)
        type: string
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # A JSON list of the package paths released by this push: `["."]` in a repo
      # with one package, `["packages/layers/addons/3d"]` in a monorepo.
      paths: ${{ steps.release.outputs.paths_released }}
    steps:
      # A token of the plutocms-release GitHub App. A release PR that the App
      # opens starts CI like any other PR; one that github.token opens does not.
      # Without the App variable, or when the App cannot give a token (it is not
      # installed on this repo, or the key is wrong), the workflow uses
      # github.token, as before: a broken App must not stop a release.
      - name: Get a token of the release App
        id: app-token
        if: ${{ vars.PLUTO_RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLUTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLUTO_RELEASE_APP_PRIVATE_KEY }}

      # `continue-on-error` reports a failed step as passed, so say it here.
      - name: Warn when the release App gave no token
        if: ${{ steps.app-token.outcome == 'failure' }}
        run: echo "::warning::The plutocms-release App gave no token (is it installed on this repo?). release-please uses github.token, so CI does not start on the release PR, and the fan-out cannot run."

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Re-run lint/typecheck/build against the release commit. release-please's own
  # commit lands on main and is only covered by CI running in parallel with
  # this workflow — without this gate a red main could still publish.
  verify:
    name: Verify
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    uses: ./.github/workflows/ci.yml
    with:
      # `env` is not available in a reusable-workflow `with:`, so this
      # expression is repeated in the publish job below. The tags of one
      # release all point at the push commit.
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance via OIDC trusted publishing
      contents: read
    outputs:
      # `name@version` of each package published by this run, space-separated.
      published: ${{ steps.publish.outputs.published }}
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
    steps:
      # Check out the release commit, not the branch head: another commit can
      # land on main between the release commit and this job, which would
      # otherwise publish a tree that does not match the released versions.
      - name: Checkout ${{ env.REF }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1. Node 24 currently bundles a new
      # enough npm, but pinning the dependency explicitly keeps the release from
      # breaking if the bundled version ever moves backwards.
      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The packages to publish: the paths that release-please released, or, on
      # the manual trigger, every package of release-please-config.json. A
      # version that npm already has is skipped, so a run can be repeated.
      # `npm publish --dry-run` first prints the tarball contents in the log, so
      # an accidental addition is visible after the fact. No token is needed:
      # OIDC trusted publishing handles auth and provenance.
      - name: Publish the released packages
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          PATHS: ${{ needs.release-please.outputs.paths || '[]' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            paths=$(node -p "Object.keys(require('./release-please-config.json').packages).join('\n')")
          else
            paths=$(node -p "JSON.parse(process.env.PATHS).join('\n')")
          fi
          published=''
          while read -r path; do
            [ -z "$path" ] && continue
            name=$(node -p "require('./$path/package.json').name")
            version=$(node -p "require('./$path/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already."
              continue
            fi
            echo "::group::$name@$version ($path)"
            (cd "$path" && npm publish --dry-run --access public && npm publish --access public)
            echo "::endgroup::"
            published="$published $name@$version"
          done <<< "$paths"
          echo "published=${published# }" >> "$GITHUB_OUTPUT"

  # After the versions are on npm: the two-wave update of every Pluto repo that
  # uses @plutocms packages (.github/scripts/plutocms-fanout.sh). The layers
  # refresh their lockfiles, then the templates and the docs site move to the
  # new versions; each one merges when its CI is green. It needs the release
  # App, because github.token cannot start a workflow in another repo.
  fanout:
    name: Update the other repos
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.published != '' && vars.PLUTO_RELEASE_APP_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A token for every repo of the org that the App is installed on.
      - name: Get a token of the release App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLUTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLUTO_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # The update workflows read `latest` from npm, so wait until npm serves
      # every published version.
      - name: Wait for npm
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          set -euo pipefail
          for item in $PUBLISHED; do
            name=${item%@*}
            version=${item##*@}
            ok=''
            for _ in $(seq 1 30); do
              latest=$(curl -fsS "https://registry.npmjs.org/$name/latest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || true)
              [ "$latest" = "$version" ] && { echo "npm serves $name@$latest"; ok=1; break; }
              sleep 10
            done
            [ -n "$ok" ] || echo "::warning::npm does not serve $name@$version yet; the update runs anyway"
          done

      - name: Run the fan-out
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/plutocms-fanout.sh
