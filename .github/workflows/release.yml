name: Release

on:
  push:
    branches: [main]

  # Escape hatch: the GitHub release and tag are created before `npm publish`
  # runs, so a failed publish cannot be retried by re-running release-please.
  # Use this to publish an existing tag without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish to npm (e.g. v0.1.2)
        type: string
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A token of the plutocms-release GitHub App. A release PR that the App
      # opens starts CI like any other PR; one that github.token opens does not.
      # Without the App variable, the workflow uses github.token, as before.
      - name: Get a token of the release App
        id: app-token
        if: ${{ vars.PLUTO_RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLUTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLUTO_RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Re-run lint/typecheck/build against the tagged tree. release-please's own
  # commit lands on main and is only covered by CI running in parallel with
  # this workflow — without this gate a red main could still publish.
  verify:
    name: Verify
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    uses: ./.github/workflows/ci.yml
    with:
      # `env` is not available in a reusable-workflow `with:`, so this
      # expression is repeated in the publish job below.
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance via OIDC trusted publishing
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Check out the tag, not the branch head: another commit can land on main
      # between the release commit and this job, which would otherwise publish
      # a tree that does not match the released version.
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1. Node 24 currently bundles a new
      # enough npm, but pinning the dependency explicitly keeps the release from
      # breaking if the bundled version ever moves backwards.
      - name: Upgrade npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Guards against a hand-edited version in package.json drifting from the
      # tag release-please created.
      - name: Check package version matches tag
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::package.json is $version but the tag is $TAG"
            exit 1
          fi
          echo "package.json version $version matches tag $TAG"

      # Surfaces the exact tarball contents in the job log, so an accidental
      # addition (a stray scratch directory, a lockfile) is visible after the
      # fact instead of only on npm.
      - name: Inspect tarball contents
        run: npm publish --dry-run --access public

      - name: Publish to npm
        # No token needed — OIDC trusted publishing handles auth automatically.
        # Provenance is also generated automatically; no --provenance flag required.
        run: npm publish --access public

  # After the version is on npm: the two-wave update of every Pluto repo that
  # uses @plutocms packages (.github/scripts/plutocms-fanout.sh). The layers
  # refresh their lockfiles, then the templates and the docs site move to the
  # new version; each one merges when its CI is green. It needs the release
  # App, because github.token cannot start a workflow in another repo.
  fanout:
    name: Update the other repos
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && vars.PLUTO_RELEASE_APP_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A token for every repo of the org that the App is installed on.
      - name: Get a token of the release App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLUTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLUTO_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # The update workflows read `latest` from npm, so wait until npm serves
      # the new version.
      - name: Wait for npm
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          for _ in $(seq 1 30); do
            latest=$(curl -fsS "https://registry.npmjs.org/$name/latest" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || true)
            [ "v$latest" = "$TAG" ] && { echo "npm serves $name@$latest"; exit 0; }
            sleep 10
          done
          echo "::warning::npm does not serve $TAG yet; the update runs anyway"

      - name: Run the fan-out
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/plutocms-fanout.sh
