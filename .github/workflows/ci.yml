name: CI

on:
  pull_request:
    # A change to the root Markdown files or to `.claude/` needs no CI run.
    # The Release workflow calls this file with `workflow_call`, which this
    # filter does not affect.
    paths-ignore: ['*.md', '.claude/**']
  push:
    branches: [main]
    paths-ignore: ['*.md', '.claude/**']

  # Lets the Release workflow re-run these exact checks against a release tag
  # before anything is published to npm, and lets the @plutocms update
  # workflow check its branch. Keeping the checks here means there is one
  # definition of "green" shared by PRs, main, releases and updates.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out. Defaults to the triggering ref.
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR, but never cancel a run that
# a release is waiting on.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The packages Bun downloads, keyed by the lockfile. A repo without a
      # lockfile (a template) uses the latest cache of the same OS.
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Two copies of `@plutocms/core` or `@plutocms/supabase` break a Nuxt
      # app (two layers with the same name). This fails when the lockfile
      # resolves one of them to more than one version, or when it still has
      # `@plutocms/pluto`, the old name of core.
      - name: Check for duplicate Pluto packages
        run: |
          node -e '
            const fs = require("node:fs")
            if (!fs.existsSync("bun.lock")) process.exit(0)
            const lock = fs.readFileSync("bun.lock", "utf8")
            let failed = false
            if (lock.includes(`"@plutocms/pluto@`)) {
              console.log("::error::The lockfile has @plutocms/pluto, the old name of @plutocms/core. Move every package to @plutocms/core.")
              failed = true
            }
            for (const name of ["@plutocms/core", "@plutocms/supabase"]) {
              const pattern = new RegExp(`"${name}@([0-9][^"]*)"`, "g")
              const versions = new Set([...lock.matchAll(pattern)].map((m) => m[1]))
              if (versions.size > 1) {
                console.log(`::error::${name} resolves to ${versions.size} versions: ${[...versions].join(", ")}. Align the @plutocms ranges.`)
                failed = true
              } else if (versions.size === 1) {
                console.log(`${name}: one copy (${[...versions][0]})`)
              }
            }
            process.exit(failed ? 1 : 0)
          '

      # Not every repo defines every script (create-pluto has no `typecheck`,
      # supabase-storage has no `build`). Running only what exists keeps this
      # file byte-identical across all Pluto repos.
      - name: Run checks
        run: |
          set -euo pipefail
          for script in lint typecheck test build; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then
              echo "::group::bun run $script"
              bun run "$script"
              echo "::endgroup::"
            else
              echo "no \"$script\" script in package.json — skipped"
            fi
          done
