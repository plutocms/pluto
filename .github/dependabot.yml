version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # The Update @plutocms workflow (plutocms-update.yml) moves these.
    ignore:
      - dependency-name: '@plutocms/*'
    # One pull request for the minor and patch updates. A major update keeps
    # its own pull request.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
